<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 268" role="img" aria-labelledby="control-title control-desc">
  <title id="control-title">A planned path and a learned controller</title>
  <desc id="control-desc">Illustrative overhead geometry, not a recorded trajectory. A car faces right along a curved path toward a parking bay. The next waypoint is highlighted. The learned policy chooses throttle and steering to follow the path supplied by the planner.</desc>
  <defs>
    <style>
      text{font-family:"Helvetica Neue",Arial,sans-serif;font-size:15px;fill:#303638}
      .outline{fill:none;stroke:#303638;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
      .leader{fill:none;stroke:#7c8586;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
      .echo{fill:none;stroke:#303638;stroke-width:.6;stroke-opacity:.3;stroke-linecap:round}
      .route{fill:none;stroke:#57747b;stroke-width:1.9;stroke-linecap:round}
      .note{fill:#666b6c}
    </style>
    <marker id="control-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#303638" stroke-width="1.3"/></marker>
  </defs>
  <path class="route" d="M95 152C200 152 240 101 330 101C405 101 453 89 510 89"/>
  <path class="outline" d="M460 58H550V120H460"/>
  <path class="echo" d="M461 57.4 549.6 57.8 550.5 119.5" aria-hidden="true"/>
  <text x="455" y="39">Parking spot</text>
  <path class="outline" d="M496 89H522" marker-end="url(#control-arrow)"/>
  <circle cx="238.64" cy="118.95" r="4.3" fill="#57747b" stroke="#fff" stroke-width="1.5"/>
  <text x="199" y="52">Next waypoint</text>
  <path class="leader" d="M246 62 240 110"/>
  <text x="331" y="164" class="note">Planned path</text>
  <path class="leader" d="M366 147V105"/>
  <g aria-label="Car facing right">
    <rect x="80" y="137" width="60" height="30" rx="5" fill="#fff" stroke="#303638" stroke-width="1.4"/>
    <path class="echo" d="M85 136.5 134 137.4Q140.6 137.2 140.5 143V161Q140.3 167.4 134 167.5H86" aria-hidden="true"/>
    <path class="outline" d="M86 143V161M120 143V161" stroke-opacity=".45"/>
    <path class="outline" d="M87 132H99M87 172H99" stroke-width="3.5"/>
    <path class="outline" d="M126 132H138" transform="rotate(-12 132 132)" stroke-width="3.5"/>
    <path class="outline" d="M126 172H138" transform="rotate(-12 132 172)" stroke-width="3.5"/>
    <path class="outline" d="M98 152H115" marker-end="url(#control-arrow)"/>
  </g>
  <text x="44" y="202">Throttle</text>
  <path class="leader" d="M94 184V177"/>
  <text x="162" y="202">Steering</text>
  <path class="leader" d="M179 184H151L136 176"/>
  <text x="320" y="240" class="note" text-anchor="middle">I used a planner to supply the path while the policy controlled the car.</text>
</svg>
