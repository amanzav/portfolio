<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 358" role="img" aria-labelledby="control-title control-desc">
  <title id="control-title">A planned path and a learned controller</title>
  <desc id="control-desc">Illustrative overhead geometry, not a recorded trajectory. A car faces upward along a curved path toward a parking bay. The next waypoint is highlighted. The learned policy chooses throttle and steering to follow the path supplied by the planner.</desc>
  <defs>
    <style>
      text{font-family:"Helvetica Neue",Arial,sans-serif;font-size:16px;fill:#303638}
      .outline{fill:none;stroke:#303638;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
      .leader{fill:none;stroke:#7c8586;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
      .echo{fill:none;stroke:#303638;stroke-width:.6;stroke-opacity:.3;stroke-linecap:round}
      .route{fill:none;stroke:#57747b;stroke-width:1.9;stroke-linecap:round}
      .note{fill:#666b6c}
    </style>
    <marker id="control-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#303638" stroke-width="1.3"/></marker>
  </defs>
  <path class="route" d="M103 245C103 190 160 173 160 140C160 100 217 105 217 58"/>
  <path class="outline" d="M193 90V21H241V90"/>
  <path class="echo" d="M192.5 89 193.4 20.5 240.6 21.4 241.5 89" aria-hidden="true"/>
  <text x="16" y="46">Parking spot</text>
  <path class="leader" d="M117 43H184"/>
  <path class="outline" d="M217 70V45" marker-end="url(#control-arrow)"/>
  <circle cx="139.936" cy="175.376" r="4.3" fill="#57747b" stroke="#fff" stroke-width="1.5"/>
  <text x="16" y="129">Next waypoint</text>
  <path class="leader" d="M103 138 134 168"/>
  <g aria-label="Car facing upward">
    <rect x="88" y="200" width="30" height="60" rx="5" fill="#fff" stroke="#303638" stroke-width="1.4"/>
    <path class="echo" d="M87.5 254 88.4 206Q88.2 199.6 94 199.5H112Q118.4 199.7 118.5 206V254" aria-hidden="true"/>
    <path class="outline" d="M94 206H112M94 240H112" stroke-opacity=".45"/>
    <path class="outline" d="M83 240V252M123 240V252" stroke-width="3.5"/>
    <path class="outline" d="M83 204V216" transform="rotate(14 83 210)" stroke-width="3.5"/>
    <path class="outline" d="M123 204V216" transform="rotate(14 123 210)" stroke-width="3.5"/>
    <path class="outline" d="M103 236V217" marker-end="url(#control-arrow)"/>
  </g>
  <text x="16" y="289">Throttle</text>
  <path class="leader" d="M55 269 86 252"/>
  <text x="177" y="235">Steering</text>
  <path class="leader" d="M178 221H139L126 210"/>
  <text x="160" y="322" class="note" text-anchor="middle">I used a planner to supply the path</text>
  <text x="160" y="345" class="note" text-anchor="middle">while the policy controlled the car.</text>
</svg>
